<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniPulse | Campus Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'Plus Jakarta Sans',sans-serif;color:#17213b;background:#f7f8ff;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{height:70px;background:#fff;border-bottom:1px solid #e9eaf2;display:flex;align-items:center;padding:0 max(calc((100vw - 1180px)/2),24px);justify-content:space-between}a{color:inherit;text-decoration:none}.brand{font-weight:800;font-size:21px;color:#3526bb}.brand span{color:#f05c5c}.nav{display:flex;gap:30px;color:#65677b;font-size:14px}.nav a:first-child{color:#3526bb;font-weight:700}.avatar{background:#e9e7ff;color:#3526bb;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:46px 24px}.eyebrow{color:#5145d5;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px}.intro h1{font-size:42px;letter-spacing:-1.8px;margin:8px 0}.intro p{color:#707286;margin:0}.api{font:12px monospace;background:#eeedff;color:#5145d5;padding:9px 12px;border-radius:8px}.tools{display:flex;gap:12px;margin:32px 0 22px}.search{flex:1;max-width:430px}.search,input,select{border:1px solid #e1e3ed;border-radius:10px;background:#fff;padding:13px 15px;font:14px inherit;color:#34364b}.search{width:100%}select{min-width:150px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}.chip{border:0;background:#eeeff7;border-radius:999px;padding:9px 15px;color:#55586e;font:600 13px inherit;cursor:pointer}.chip.active{background:#3526bb;color:white}.count{font-size:13px;color:#76788b;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e9eaf2;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #25215a0a}.cover{height:140px;background:linear-gradient(135deg,#d9d6ff,#f8c9c8);padding:16px;display:flex;align-items:end}.cover b{background:#ffffffdb;padding:7px 11px;border-radius:7px;font-size:11px;color:#4538bc}.content{padding:18px}.content h2{font-size:18px;margin:0 0 9px}.meta{color:#74768a;font-size:13px;line-height:1.8}.foot{border-top:1px solid #eeeef4;margin-top:16px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.status{font-size:11px;color:#19835d;background:#e6f7ef;padding:6px 9px;border-radius:99px}.empty,.error,.loading{background:#fff;border-radius:14px;padding:50px;text-align:center;color:#74768a;grid-column:1/-1}.error{color:#9a3434}.footer{padding:35px 24px;background:#eeeff8;color:#77798c;text-align:center;font-size:12px;margin-top:55px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.intro{align-items:start;flex-direction:column}.intro h1{font-size:34px}.nav{gap:14px}}@media(max-width:560px){header{padding:0 16px}.nav{display:none}.wrap{padding:34px 16px}.tools{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.grid{grid-template-columns:1fr}.api{font-size:11px}}
  </style>
</head>
<body>
  <header><a class="brand" href="#">Uni<span>Pulse</span></a><nav class="nav"><a href="#events">Explore events</a><a href="#events">My registrations</a><a href="#events">For organizers</a></nav><div class="avatar">S</div></header>
  <main class="wrap" id="events">
    <div class="intro"><div><div class="eyebrow">Your campus, in motion</div><h1>Find your next thing.</h1><p>Discover the events, people, and moments happening around campus.</p></div><div class="api">LIVE DATA · GET /api/events</div></div>
    <div class="tools"><input id="search" class="search" placeholder="⌕  Search campus events…"><select id="status"><option value="all">All statuses</option><option value="open">Open</option><option value="upcoming">Upcoming</option></select></div>
    <div class="chips"><button class="chip active" data-filter="all">All events</button><button class="chip" data-filter="open">Open</button><button class="chip" data-filter="upcoming">Upcoming</button><button class="chip" data-filter="closed">Closed</button></div>
    <div class="count" id="count">Loading events…</div><section class="grid" id="grid"><div class="loading">Loading campus events…</div></section>
  </main><footer class="footer">UniPulse · Make campus life count</footer>
  <script>
    // Uses the same local proxy as the backend preview; change this to your deployed API URL when hosted.
    const API_URL = '/proxy/5000/api/events';
    const grid=document.querySelector('#grid'), count=document.querySelector('#count'), search=document.querySelector('#search');let events=[],filter='all';
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const q=search.value.trim().toLowerCase();const rows=events.filter(e=>(filter==='all'||String(e.status||'').toLowerCase()===filter)&&(!q||`${e.title||''} ${e.description||''} ${e.location||''}`.toLowerCase().includes(q)));count.textContent=`${rows.length} ${rows.length===1?'event':'events'} to explore`;grid.innerHTML=rows.length?rows.map((e,i)=>`<article class="card"><div class="cover" style="background:${['linear-gradient(135deg,#d9d6ff,#f8c9c8)','linear-gradient(135deg,#c7eee5,#e6f5c9)','linear-gradient(135deg,#ffe0b8,#f5cbd9)'][i%3]}"><b>${esc(e.status||'CAMPUS EVENT')}</b></div><div class="content"><h2>${esc(e.title||'Untitled event')}</h2><div class="meta">${esc(e.location||'Campus event')}<br>${e.capacity==null?'Capacity not specified':`${esc(e.capacity)} spots`}</div><div class="foot"><span>Hosted by campus community</span><span class="status">${esc(e.status||'Open')}</span></div></div></article>`).join(''):'<div class="empty">No events match that search yet.</div>'}
    search.addEventListener('input',render);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#status').onchange=e=>{filter=e.target.value;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));render()};
    fetch(API_URL).then(r=>{if(!r.ok)throw Error(`API returned ${r.status}`);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Expected an event list from the API');events=data;render()}).catch(err=>{count.textContent='Could not load events';grid.innerHTML=`<div class="error">Unable to connect to the events API.<br><small>${esc(err.message)}</small><br><small>Check the API URL and that the backend is running.</small></div>`});
  </script>
</body>
</html>
